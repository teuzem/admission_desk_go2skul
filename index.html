<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Primary Meta Tags -->
  <title>Admission Desk — International University Admissions Platform</title>
  <meta name="description" content="Admission Desk — Your trusted partner for international university admissions. Manage applications, explore courses, and connect with top universities worldwide." />
  <meta name="keywords" content="university admissions, international education, study abroad, agent portal, university applications, courses, programs, higher education" />
  <meta name="author" content="Admission Desk" />
  <meta name="theme-color" content="#3A4391" />
  <meta name="msapplication-TileColor" content="#3A4391" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://admission-desk.netlify.app/" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Admission Desk" />
  <meta property="og:title" content="Admission Desk — International University Admissions Platform" />
  <meta property="og:description" content="Your trusted partner for international university admissions. Manage applications, explore courses, and connect with top universities worldwide." />
  <meta property="og:image" content="https://admission-desk.netlify.app/og-image.png" />
  <meta property="og:url" content="https://admission-desk.netlify.app/" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Admission Desk — International University Admissions Platform" />
  <meta name="twitter:description" content="Your trusted partner for international university admissions. Manage applications, explore courses, and connect with top universities worldwide." />
  <meta name="twitter:image" content="https://admission-desk.netlify.app/og-image.png" />

  <!-- Favicon & Manifest -->
  <link rel="icon" type="image/png" href="/pathfinder-illustration.png" />
  <link rel="apple-touch-icon" href="/pathfinder-illustration.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Google Fonts: Montserrat, Poppins, Open Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Structured Data (JSON-LD) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Admission Desk",
      "url": "https://admission-desk.netlify.app",
      "logo": "https://admission-desk.netlify.app/pathfinder-illustration.png",
      "description": "Your trusted partner for international university admissions. Manage applications, explore courses, and connect with top universities worldwide.",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["English", "French"]
      }
    }
  </script>

  <!-- Structured Data: WebSite with SearchAction -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Admission Desk",
      "url": "https://admission-desk.netlify.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://admission-desk.netlify.app/dashboard/courses?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
